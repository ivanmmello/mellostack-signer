name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish release
        run: mvn -B -Prelease clean deploy -DskipTests -pl mellostack-signer-core,mellostack-signer-providers,mellostack-signer-validator,mellostack-signer-sdk -am
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mellostack-signer-sdk/target/mellostack-signer-sdk-*.jar
            mellostack-signer-sdk/target/mellostack-signer-sdk-*-sources.jar
            mellostack-signer-sdk/target/mellostack-signer-sdk-*-javadoc.jar
